<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGI SYSTEM - HORMONE EDITION</title>
    <style>
        body {
            background-color: #000;
            color: #ff9900;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 2vh 2vw;
            height: 96vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .magi-monitor {
            border: 3px solid #ff9900;
            width: 100%;
            height: 100%;
            position: relative;
            box-sizing: border-box;
            background: #000;
        }

        /* Top Left Header */
        .header-left {
            position: absolute;
            top: 20px;
            left: 30px;
        }
        .header-left h1 {
            font-size: 4em;
            margin: 0;
            letter-spacing: 15px;
            text-shadow: 2px 2px 0px #aa6600;
        }
        .green-lines {
            width: 300px;
            height: 4px;
            background-color: #2e8b57;
            margin-top: 5px;
            box-shadow: 0 8px 0 #2e8b57;
        }

        /* Top Right Header */
        .header-right {
            position: absolute;
            top: 20px;
            right: 30px;
            text-align: right;
        }
        .header-right h1 {
            font-size: 4em;
            margin: 0;
            letter-spacing: 15px;
            text-shadow: 2px 2px 0px #aa6600;
        }
        .info-box {
            display: inline-block;
            border: 2px solid #42bcf5;
            color: #42bcf5;
            padding: 5px 15px;
            font-size: 2em;
            font-weight: bold;
            margin-top: 40px;
            letter-spacing: 5px;
        }

        /* Code Info Text */
        .code-info {
            position: absolute;
            top: 150px;
            left: 30px;
            font-size: 1.1em;
            line-height: 1.4;
        }
        .code-info .highlight { font-size: 1.8em; font-weight: bold; margin-bottom: 10px; }

        /* Center MAGI Cores Layout */
        .core-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 500px;
        }

        .magi-center-text {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3em;
            font-weight: bold;
            color: #ff9900;
            letter-spacing: 5px;
            z-index: 10;
        }

        .core-panel {
            position: absolute;
            background-color: #42bcf5;
            color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 2em;
            transition: all 0.5s ease;
        }

        .core-subtext {
            font-size: 0.4em;
            color: #111;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .result-text {
            font-size: 1.2em;
            margin-top: 10px;
            display: none; /* 숨겨두었다가 판결 시 노출 */
        }

        /* Polygon Shapes based on the image */
        .balthasar {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            height: 220px;
            clip-path: polygon(0 0, 100% 0, 100% 75%, 75% 100%, 25% 100%, 0 75%);
        }

        .casper {
            bottom: 0;
            left: 0;
            width: 350px;
            height: 220px;
            clip-path: polygon(0 0, 75% 0, 100% 25%, 100% 100%, 0 100%);
        }

        .melchior {
            bottom: 0;
            right: 0;
            width: 350px;
            height: 220px;
            clip-path: polygon(25% 0, 100% 0, 100% 100%, 0 100%, 0 25%);
        }

        /* Bottom Input Section */
        .input-section {
            position: absolute;
            bottom: 20px;
            left: 30px;
            width: calc(100% - 60px);
            font-size: 1.2em;
        }
        
        .input-row {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .input-row label {
            width: 150px;
            color: #ff9900;
        }
        .input-row input {
            flex-grow: 1;
            background: transparent;
            border: 1px solid #ff9900;
            color: #ff9900;
            font-family: inherit;
            font-size: 1em;
            padding: 5px;
            outline: none;
        }
        
        /* Final Overlay */
        #final-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            color: #fff;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #final-overlay h1 { font-size: 6em; margin: 0; letter-spacing: 20px; }
        #final-overlay p { font-size: 1.5em; color: #ff9900; }
        .close-btn { margin-top: 30px; padding: 10px 30px; background: #ff9900; color: #000; border: none; font-size: 1.2em; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="magi-monitor">
        
        <div class="header-left">
            <h1>質 問</h1>
            <div class="green-lines"></div>
        </div>

        <div class="header-right">
            <h1>解 決</h1>
            <div class="green-lines" style="float: right;"></div>
            <div style="clear: both;"></div>
            <div class="info-box">情 報</div>
        </div>

        <div class="code-info">
            <div class="highlight">CODE: 473</div>
            FILE: MAGI__SYS<br>
            EXTENTION: 3023<br>
            EX_MODE: OFF<br>
            PRIORITY: AAA
        </div>

        <div class="core-container">
            <div class="magi-center-text">MAGI</div>

            <!-- BALTHASAR 2 : 배란기 -->
            <div class="core-panel balthasar" id="magi2">
                BALTHASAR・2
                <div class="core-subtext">[배란기의 나 : 사교/충동]</div>
                <div class="result-text" id="res2"></div>
            </div>

            <!-- CASPER 3 : 황체기 -->
            <div class="core-panel casper" id="magi3">
                CASPER・3
                <div class="core-subtext">[황체기의 나 : 휴식/방어]</div>
                <div class="result-text" id="res3"></div>
            </div>

            <!-- MELCHIOR 1 : 난포기 -->
            <div class="core-panel melchior" id="magi1">
                MELCHIOR・1
                <div class="core-subtext">[난포기의 나 : 이성/계획]</div>
                <div class="result-text" id="res1"></div>
            </div>
        </div>

        <div class="input-section">
            <div class="input-row">
                <label>access code:</label>
                <input type="text" value="************************" disabled style="border: none; border-bottom: 1px dotted #ff9900;">
            </div>
            <div class="input-row">
                <label>question:</label>
                <!-- 기본 안건 삭제, Enter 키 이벤트 추가 -->
                <input type="text" id="agenda-input" placeholder="안건을 입력하고 Enter를 누르십시오." onkeypress="handleEnter(event)">
            </div>
        </div>

    </div>

    <!-- 최종 결과 오버레이 -->
    <div id="final-overlay">
        <h1 id="overlay-title">合 意</h1>
        <p id="overlay-desc">세 자아가 안건에 모두 동의하였습니다.</p>
        <button class="close-btn" onclick="resetSystem()">SYSTEM RESET</button>
    </div>

    <script>
        function handleEnter(e) {
            if (e.key === 'Enter') {
                startVote();
            }
        }

        function startVote() {
            const agenda = document.getElementById('agenda-input').value.trim();
            if(!agenda) {
                alert("질문(question)을 입력해 주십시오.");
                return;
            }

            // 난포기 (이성/효율) - 가결 확률 50%
            const vote1 = Math.random() > 0.5; 
            // 배란기 (사교/충동) - 가결 확률 70%
            const vote2 = Math.random() > 0.3; 
            // 황체기 (휴식/보호) - 가결 확률 20% (보수적)
            const vote3 = Math.random() > 0.8; 

            // 패널 UI 업데이트
            updatePanel('magi1', 'res1', vote1);
            updatePanel('magi2', 'res2', vote2);
            updatePanel('magi3', 'res3', vote3);

            // 만장일치제 최종 판결 계산 (1초 후 오버레이 표시)
            setTimeout(() => {
                const overlay = document.getElementById('final-overlay');
                const title = document.getElementById('overlay-title');
                const desc = document.getElementById('overlay-desc');

                overlay.style.display = 'flex';

                if(vote1 && vote2 && vote3) {
                    title.innerText = "合 意 (APPROVE)";
                    title.style.color = "#33ff33";
                    desc.innerText = "조건 클리어. 만장일치로 안건이 가결되었습니다.";
                } else {
                    title.innerText = "拒 絶 (DENY)";
                    title.style.color = "#ff3333";
                    desc.innerText = "만장일치 실패. 안건이 기각되었습니다.";
                }
            }, 1000);
        }

        function updatePanel(panelId, resId, isApproved) {
            const panel = document.getElementById(panelId);
            const res = document.getElementById(resId);
            
            res.style.display = "block";
            if(isApproved) {
                res.innerHTML = "승 인 (合 意)";
                res.style.color = "#2e8b57"; // 초록색 계열 텍스트
                panel.style.backgroundColor = "#ccffcc"; // 패널 배경이 밝아짐
            } else {
                res.innerHTML = "거 절 (拒 絶)";
                res.style.color = "#cc0000"; // 붉은색 계열 텍스트
                panel.style.backgroundColor = "#ffcccc"; // 패널 배경이 붉어짐
            }
        }

        function resetSystem() {
            document.getElementById('final-overlay').style.display = 'none';
            document.getElementById('agenda-input').value = '';
            
            // 패널 초기화
            const panels = ['magi1', 'magi2', 'magi3'];
            const results = ['res1', 'res2', 'res3'];
            
            panels.forEach(id => document.getElementById(id).style.backgroundColor = "#42bcf5");
            results.forEach(id => document.getElementById(id).style.display = "none");
            
            document.getElementById('agenda-input').focus();
        }
    </script>
</body>
</html>
